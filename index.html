<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>products</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <main class="cards-catalog">
      <h1 class="cards-catalog__title">Выбери свой продукт</h1>
      <div class="cards-catalog__list">
        <div>
          <button id="change-color-all-card"">Сменить цвет всех карточек</button>
          <button id="change-color-first-card">Сменить цвет первой карточки</button>
          <button id="open-google">Открыть страницу Google.com</button>
          <button id="output-console-log">Вывести сообщение в консоль лог</button>
          <button class="change-color-button">Сменить цвет кнопки и обратно</button>
        </div>
        <ul id="product-list"></ul>
        <template id="product-template">
          <article class="product-card">
          <img class="product-card__image" src="" alt="" width="290" height="245"/>
          <div class="product-card__purpose"></div>
          <h3 class="product-card__title"></h3>
          <p class="product-card__description"></p>
          <p class="product-card__compound">Состав:</p>
          <ul class="product-card__ingredients"></ul>
          <div class="product-card__price">
            <b>Цена:</b>
            <span></span>
          </div>
          </article>
        </template>
      </div>
      <script src="main.js"></script>
      <script src="homework-7.js"></script>
      <script src="homework-8.js"></script>
      <script src="homework-9.js" type="module"></script>
      <script src="homework-10.js" type="module"></script>
    </main>
  </body>
</html>
